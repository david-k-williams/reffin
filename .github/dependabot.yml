version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /packages/python/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pub
    directories:
      - /packages/flutter/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter-dependencies:
        patterns:
          - "*"
