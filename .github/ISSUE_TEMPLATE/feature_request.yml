name: Feature request
description: Suggest a new lookup, API, or supported workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case and why existing Reffin APIs do not cover it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include the affected domains and languages when known.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: input
    id: source
    attributes:
      label: Candidate data source
      description: For new reference data, link to the authoritative source and its terms.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
