[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reffin-merchants"
version = "0.1.0"
description = "Offline, vendor-aware Merchant Category Code reference data from Reffin"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reffin_merchants = ["py.typed"]
